name: Refresh repository activity

on:
  schedule:
    # ── run weekly on Monday at 01:00 UTC ──────────────────────────
    - cron: '0 1 * * 1'
  workflow_dispatch:           # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v1
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh activity data
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          python scripts/update_repo_status.py

      - name: Check the site still builds
        run: |
          mkdocs build --strict

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          title: "[Weekly] Refresh repository activity"
          commit-message: "data: weekly refresh of repository activity"
          add-paths: |
            data/repo_status.yml
          body: |
            Auto-generated by CI [update-dates.yaml]

            Refreshes the last-commit date and archived flag of every
            repository in data/catalog.yml (written to data/repo_status.yml).
